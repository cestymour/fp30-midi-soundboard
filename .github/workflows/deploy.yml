name: Deploy Piano fp30x midi Soundboard to GitHub Pages

on:
  push:
    branches:
      - main # Déclenche le workflow à chaque push sur la branche 'main'
  workflow_dispatch:

# Permet aux actions de déployer sur GitHub Pages
permissions:
  contents: read      # Pour lire le contenu du dépôt
  pages: write        # Pour déployer sur GitHub Pages
  id-token: write     # Pour l'authentification OIDC nécessaire au déploiement

jobs:
  # Job de déploiement
  deploy:
    environment:
      name: github-pages      # Environnement de déploiement (standard pour GitHub Pages)
      url: ${{ steps.deployment.outputs.page_url }} # URL du site après déploiement
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc' # Même version de Node qu'en local
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build    # Construit le site dans dist/ (app + Service Worker)

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: 'dist'        # Site construit par Vite

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4 # Action qui déploie l'artefact sur GitHub Pages
